name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check formatting
        working-directory: ble_ota
        run: git ls-files '*.c' '*.h' | xargs uvx clang-format==23.1.1 --style=file --dry-run -Werror

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the history
        run: |
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c
          tar -xzf $archive gitleaks
          ./gitleaks git --redact --no-banner -v

  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    env:
      IDF_TOOLCHAIN: clang
      # Findings on main when the job was added. Lower it when you fix some.
      MAX_WARNINGS: 6
    steps:
      - uses: actions/checkout@v5
      - name: Run idf.py clang-check
        shell: bash
        working-directory: ble_ota/examples/minimal
        run: |
          $IDF_PATH/tools/idf_tools.py install esp-clang
          . $IDF_PATH/export.sh
          idf.py set-target esp32c6
          idf.py clang-check --exit-code --include-paths "$(realpath ../..)" \
            --exclude-paths "$(realpath managed_components)" \
            --run-clang-tidy-options "-header-filter=ble_ota/"
          count=$(grep -cE ': (warning|error): .*\[' warnings.txt || true)
          grep -E ': (warning|error): .*\[' warnings.txt || true
          echo "clang-tidy findings: $count (max $MAX_WARNINGS)"
          test "$count" -le "$MAX_WARNINGS"

  test:
    name: Unit tests (QEMU esp32c3)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install the ESP-IDF CI requirements
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          uv pip install --python "$(command -v python)" \
            -r $IDF_PATH/tools/requirements/requirements.ci.txt \
            -c $IDF_TOOLS_PATH/espidf.constraints.v6.1.txt
      - name: Build the test app
        shell: bash
        working-directory: ble_ota
        run: |
          . $IDF_PATH/export.sh
          idf-ci build run -p test_apps -t esp32c3 -m qemu
      - name: Run the tests
        shell: bash
        working-directory: ble_ota
        # QEMU emulates esp32, esp32c3 and esp32s3 only.
        run: |
          . $IDF_PATH/export.sh
          pytest -m qemu --target esp32c3 --junitxml=report.xml
      - name: Report the coverage
        shell: bash
        working-directory: ble_ota
        run: |
          . $IDF_PATH/export.sh
          uvx gcovr==8.7 --gcov-executable riscv32-esp-elf-gcov --filter src/ --print-summary \
            --markdown-summary "$GITHUB_STEP_SUMMARY" --html-details test_apps/build/coverage/ test_apps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: ble_ota/report.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ble_ota/test_apps/build/coverage/

  build:
    name: Build ${{ matrix.example }} (${{ matrix.target }}, IDF ${{ matrix.idf }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [minimal]
        target: [esp32c6, esp32s31]
        idf: [v6.1]
    steps:
      - uses: actions/checkout@v5
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: ble_ota/examples/${{ matrix.example }}
          # esp32s31 is a preview target.
          command: idf.py --preview build
